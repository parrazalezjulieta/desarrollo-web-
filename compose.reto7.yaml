
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico
    volumes:
      - datos_academicos_reto7:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico -d academico"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_academicos_reto7:
